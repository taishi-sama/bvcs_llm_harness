[package]
name = "bvcs_llm_harness"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [
  "crates/*",
]

[dependencies]
anyhow = "1.0.104"
bevy = { version = "0.20.0", features = ["system_font_discovery"]}
boa_engine = "0.22.0"
bevy-tokio-tasks = "0.20.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
llm_api = { path = "crates/llm_api" }
llm_history_model = { path = "crates/llm_history_model" }
bevy_brp_extras = "0.23.0"
serde_json = "1.0.151"
tokio = { version = "1.54.0", features = ["full"] }
