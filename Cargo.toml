[package]
name = "bvcs_llm_harness"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [
  "crates/*",
]

[dependencies]
anyhow = "1.0.104"
bevy = { version = "0.20.0", features = ["system_font_discovery", "system_clipboard"]}
boa_engine = "0.22.0"
bevy-tokio-tasks = "0.20.0"
futures-util = "0.3.34"
llm_api = { path = "crates/llm_api" }
llm_history_model = { path = "crates/llm_history_model" }
bevy_brp_extras = "0.23.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.0", features = ["full"] }
regex = "1.13.1"
